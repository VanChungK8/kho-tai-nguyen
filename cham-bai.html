<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Viện Lập Trình | Trạm Chấm Điểm</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Custom styles for Teacher Portal */
        .admin-login-wrapper {
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(7, 11, 25, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid var(--cyan);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        .table-cyber {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
        }
        .table-cyber th {
            background: rgba(0, 240, 255, 0.1);
            color: var(--cyan);
            border-bottom: 2px solid var(--cyan);
            font-weight: 600;
        }
        .table-cyber td {
            background: transparent;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }
        .table-cyber tbody tr:hover td {
            background: rgba(0, 240, 255, 0.05);
        }
        .filter-section {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .essay-modal-content {
             background: var(--card-bg); 
             border: 1px solid var(--purple);
             box-shadow: 0 0 40px rgba(188, 19, 254, 0.2);
             border-radius: 16px; 
             padding: 30px;
        }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="glow-orb orb-1"></div>

    <nav class="navbar navbar-dark bg-transparent pt-4 position-relative z-1">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center logo-text" href="index.html">
                <i class="fa-solid fa-cube me-2 text-cyan"></i> DevAcademy <span class="text-secondary fs-6 ms-2">| Teacher Portal</span>
            </a>
            <button id="btn-logout" class="btn btn-outline-danger btn-sm d-none">
                <i class="fa-solid fa-power-off me-1"></i> THOÁT
            </button>
        </div>
    </nav>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-section" class="container position-relative z-1 admin-login-wrapper">
        <div class="login-card text-center">
            <i class="fa-solid fa-user-shield fs-1 text-cyan mb-3"></i>
            <h3 class="text-white fw-bold mb-4">TRẠM CHẤM ĐIỂM</h3>
            <form id="login-form">
                <div class="mb-3">
                    <input type="password" id="teacher-password" class="form-control cyber-input text-center fs-5" placeholder="Nhập mã bảo mật..." required>
                </div>
                <button type="submit" class="btn btn-cyber w-100 fw-bold">XÁC THỰC</button>
            </form>
            <p id="login-error" class="text-danger mt-3 mb-0 d-none"><small>Mã bảo mật không chính xác!</small></p>
        </div>
    </div>

    <!-- MÀN HÌNH CHẤM BÀI -->
    <main id="dashboard-section" class="container position-relative z-1 pb-5 d-none mt-4">
        
        <!-- Bộ lọc -->
        <div class="filter-section d-flex flex-wrap gap-3 align-items-end">
            <div class="flex-grow-1">
                <label class="text-cyan small fw-bold mb-1"><i class="fa-solid fa-filter me-1"></i>Lọc theo Bài Tập (Module)</label>
                <select id="filter-lesson" class="form-select cyber-input text-white">
                    <option value="all">-- Hiển thị tất cả bài nộp --</option>
                    <!-- Options sẽ được đổ bằng JS -->
                </select>
            </div>
            <div class="flex-grow-1">
                <label class="text-purple small fw-bold mb-1"><i class="fa-solid fa-magnifying-glass me-1"></i>Tìm theo Tên Học Sinh</label>
                <input type="text" id="filter-name" class="form-control cyber-input" placeholder="Nhập tên học sinh...">
            </div>
            
            <button id="btn-refresh" class="btn btn-outline-info fw-bold text-white"><i class="fa-solid fa-rotate-right me-2"></i>LÀM MỚI</button>
        </div>

        <!-- Bảng Dữ Liệu -->
        <div class="table-responsive table-cyber">
            <table class="table table-borderless mb-0">
                <thead>
                    <tr>
                        <th class="py-3 px-4">Thời gian nộp</th>
                        <th class="py-3 px-4">Họ và Tên</th>
                        <th class="py-3 px-4">Tên Bài Tập</th>
                        <th class="py-3 px-4 text-center">Trắc nghiệm</th>
                        <th class="py-3 px-4 text-center">Tự luận</th>
                        <th class="py-3 px-4 text-center">Đính kèm</th>
                    </tr>
                </thead>
                <tbody id="submission-table-body">
                    <tr>
                        <td colspan="6" class="text-center py-5 text-muted">
                            <div class="spinner-border text-cyan mb-2"></div><br>Đang tải dữ liệu từ trung tâm...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal hiển thị Tự Luận -->
    <div id="essay-modal" class="cyber-modal d-none">
        <div class="essay-modal-content">
            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom border-secondary pb-2">
                <h5 class="fw-bold text-purple mb-0"><i class="fa-solid fa-align-left me-2"></i>Nội dung Tự Luận</h5>
                <button id="btn-close-essay" class="btn text-danger p-0 fs-5"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p id="essay-content-display" class="text-white fs-6" style="white-space: pre-wrap; line-height: 1.6;"></p>
        </div>
    </div>

    <!-- Modal hiển thị Trắc Nghiệm -->
    <div id="quiz-modal" class="cyber-modal d-none">
        <div class="essay-modal-content" style="border-color: var(--cyan); box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);">
            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom border-secondary pb-2">
                <h5 class="fw-bold text-cyan mb-0"><i class="fa-solid fa-list-check me-2"></i>Đáp án Trắc Nghiệm</h5>
                <button id="btn-close-quiz" class="btn text-danger p-0 fs-5"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="quiz-content-display" class="row row-cols-2 g-3 text-white"></div>
        </div>
    </div>

    <script>
        // Mật khẩu cứng (Tạm thời)
        const TEACHER_PIN = "123456"; 
        
        // Thay bằng API URL MỚI sau khi đã thêm hàm doGet
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyN-3x-Zca7YPEf5Lxn_de3yJU3BIUz25hC2USdfi3a1Jihve_azAR7UIWgP1MwHE11wA/exec";
        
        let allSubmissions = [];

        // DOM Elements
        const loginSec = document.getElementById('login-section');
        const dashSec = document.getElementById('dashboard-section');
        const btnLogout = document.getElementById('btn-logout');
        const tbody = document.getElementById('submission-table-body');
        const filterLesson = document.getElementById('filter-lesson');
        const filterName = document.getElementById('filter-name');

        // Xử lý Login
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            const pass = document.getElementById('teacher-password').value;
            if (pass === TEACHER_PIN) {
                loginSec.classList.add('d-none');
                dashSec.classList.remove('d-none');
                btnLogout.classList.remove('d-none');
                loadData();
            } else {
                document.getElementById('login-error').classList.remove('d-none');
            }
        };

        // Thoát
        btnLogout.onclick = () => {
            loginSec.classList.remove('d-none');
            dashSec.classList.add('d-none');
            btnLogout.classList.add('d-none');
            document.getElementById('teacher-password').value = '';
        }

        // Tải dữ liệu từ Google Sheets
        async function loadData() {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted"><div class="spinner-border text-cyan mb-2"></div><br>Đang đồng bộ dữ liệu...</td></tr>';
            try {
                const response = await fetch(SCRIPT_URL + "?action=getData");
                const data = await response.json();
                
                if(data.status === "success") {
                    // Loại bỏ dòng tiêu đề
                    allSubmissions = data.data.slice(1).reverse(); // Reverse để bài mới nhất lên trên
                    populateFilter();
                    renderTable(allSubmissions);
                } else {
                    throw new Error("Lỗi tải dữ liệu");
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-danger"><i class="fa-solid fa-triangle-exclamation fs-3 mb-2"></i><br>Không thể kết nối tới cơ sở dữ liệu. Vui lòng thử lại.</td></tr>';
            }
        }

        // Đổ danh sách bài học vào bộ lọc
        function populateFilter() {
            const lessons = [...new Set(allSubmissions.map(item => item[2]))].filter(l => l); // index 2 là Tên Bài
            filterLesson.innerHTML = '<option value="all">-- Hiển thị tất cả bài nộp --</option>';
            lessons.forEach(lesson => {
                filterLesson.innerHTML += `<option value="${lesson}">${lesson}</option>`;
            });
        }

        // Hiển thị bảng
        function renderTable(dataArray) {
            tbody.innerHTML = '';
            if(dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Không tìm thấy bài nộp nào.</td></tr>';
                return;
            }

            dataArray.forEach((row, index) => {
                // row: [Thời gian, Tên, Bài tập, Trắc nghiệm, Tự luận, Link]
                const timeStr = new Date(row[0]).toLocaleString('vi-VN');
                const hasEssay = row[4] && row[4].trim() !== '';
                const hasQuiz = row[3] && row[3].trim() !== '';
                const hasFile = row[5] && row[5].startsWith('http');

                const tr = document.createElement('tr');
               tr.innerHTML = `
                    <td class="px-4 text-light">${timeStr}</td>
                    <td class="px-4 fw-bold text-white">${row[1] || 'Ẩn danh'}</td>
                    <td class="px-4 text-cyan">${row[2] || 'Không xác định'}</td>
                    
                    <td class="px-4 text-center">
                        ${hasQuiz ? `<button class="btn btn-sm btn-outline-info btn-view-quiz" data-idx="${index}">Xem đáp án</button>` : '<span class="text-light opacity-75">Không có</span>'}
                    </td>
                    <td class="px-4 text-center">
                        ${hasEssay ? `<button class="btn btn-sm btn-outline-warning btn-view-essay" data-idx="${index}">Xem bài</button>` : '<span class="text-light opacity-75">Không có</span>'}
                    </td>
                    <td class="px-4 text-center">
                        ${hasFile ? `<a href="${row[5]}" target="_blank" class="btn btn-sm btn-success"><i class="fa-solid fa-download me-1"></i> Tải file</a>` : '<span class="text-light opacity-75">Không có</span>'}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Gắn sự kiện cho các nút xem
            document.querySelectorAll('.btn-view-essay').forEach(btn => {
                btn.onclick = (e) => {
                    const idx = e.target.dataset.idx;
                    document.getElementById('essay-content-display').innerText = dataArray[idx][4];
                    document.getElementById('essay-modal').classList.remove('d-none');
                }
            });

            document.querySelectorAll('.btn-view-quiz').forEach(btn => {
                btn.onclick = (e) => {
                    const idx = e.target.dataset.idx;
                    const quizStr = dataArray[idx][3]; // "Câu 1: A | Câu 2: B | "
                    const quizArr = quizStr.split('|').filter(q => q.trim() !== '');
                    const container = document.getElementById('quiz-content-display');
                    container.innerHTML = '';
                    quizArr.forEach(q => {
                        container.innerHTML += `<div class="col"><div class="p-2 border border-secondary rounded text-center">${q.trim()}</div></div>`;
                    });
                    document.getElementById('quiz-modal').classList.remove('d-none');
                }
            });
        }

        // Xử lý Lọc
        function applyFilters() {
            const lessonSelect = filterLesson.value;
            const nameSearch = filterName.value.toLowerCase();

            const filtered = allSubmissions.filter(row => {
                const matchLesson = (lessonSelect === 'all') || (row[2] === lessonSelect);
                const matchName = (row[1] || '').toLowerCase().includes(nameSearch);
                return matchLesson && matchName;
            });
            renderTable(filtered);
        }

        filterLesson.onchange = applyFilters;
        filterName.oninput = applyFilters;
        document.getElementById('btn-refresh').onclick = loadData;

        // Đóng modals
        document.getElementById('btn-close-essay').onclick = () => document.getElementById('essay-modal').classList.add('d-none');
        document.getElementById('btn-close-quiz').onclick = () => document.getElementById('quiz-modal').classList.add('d-none');

    </script>
</body>
</html>
