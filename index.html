<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Viện Lập Trình | Khám Phá Mã Nguồn</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="cyber-grid"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <nav class="navbar navbar-dark bg-transparent pt-4 position-relative z-1">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center logo-text" href="#">
                <i class="fa-solid fa-cube me-2 text-cyan"></i> DevAcademy
            </a>
            <div class="code-badge">
                <i class="fa-solid fa-terminal me-2"></i> system.ready()
            </div>
        </div>
    </nav>

    <div class="container text-center pt-5 pb-5 position-relative z-1 hero-section">
        <div class="icon-3d mb-4">
            <i class="fa-brands fa-space-awesome"></i>
        </div>
        <h1 class="display-3 fw-black text-white title-glitch" data-text="KHO TÀNG LẬP TRÌNH">KHO TÀNG LẬP TRÌNH</h1>
        <p class="lead mt-3 mx-auto desc-text">Khởi động hành trình sáng tạo. Chọn module bên dưới để truy cập tài
            nguyên, mã nguồn và bài tập thực hành.</p>
    </div>

    <main class="container position-relative z-1 pb-5">

        <div id="category-section">
            <div class="d-flex align-items-center mb-4">
                <h4 class="fw-bold mb-0 text-cyan"><i class="fa-solid fa-folder-tree me-2"></i>MODULES HỌC TẬP</h4>
                <div class="line-glow ms-3"></div>
            </div>
            <div id="category-container" class="row g-4">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-cyan"></div>
                </div>
            </div>
        </div>

        <div id="file-section" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
                <h4 id="current-category-name" class="fw-bold text-white mb-0"></h4>
                <button id="btn-back" class="btn btn-cyber">
                    <i class="fa-solid fa-arrow-left me-2"></i>TRỞ VỀ
                </button>
            </div>

            <div class="row g-3" id="file-container">
            </div>
        </div>
    </main>

    <script type="module" src="assets/js/main.js"></script>
</body>

</html>
